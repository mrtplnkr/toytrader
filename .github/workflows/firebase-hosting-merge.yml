name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - master
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install and build (captured for diagnostics)
        id: build
        continue-on-error: true
        run: npm ci --loglevel verbose > npm-ci-output.log 2>&1 && npm run build >> npm-ci-output.log 2>&1
      - name: Print node/npm versions on failure
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::NODE=$(node --version) NPM=$(npm --version) OS=$(uname -a)"
      - name: Emit build log as annotations on failure
        if: steps.build.outcome == 'failure'
        run: |
          tail -c 3000 npm-ci-output.log | while IFS= read -r line; do
            echo "::error::$line"
          done
      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TOYSTRADER_A494F }}'
          channelId: live
          projectId: toystrader-a494f
